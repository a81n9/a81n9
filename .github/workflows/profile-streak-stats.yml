name: Profile Streak Stats

on:
  schedule:
    # 16:00 UTC == 00:00 BJS (next day)
    - cron: '0 16 * * *'
  # 允许随时手动执行
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate github-readme-streak-stats.svg
        uses: DenverCoder1/github-readme-streak-stats@a028da8aed0700a4d4cbe90f3482c2a2ee6188df
        with:
          options: user=${{ github.repository_owner }}&theme=default&disable_animations=true
          path: profile-streak-stats/github-readme-streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate github-readme-streak-stats-dark.svg
        uses: DenverCoder1/github-readme-streak-stats@a028da8aed0700a4d4cbe90f3482c2a2ee6188df
        with:
          options: user=${{ github.repository_owner }}&theme=ads-juicy-fresh&disable_animations=true
          path: profile-streak-stats/github-readme-streak-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: update cache version
        shell: bash
        run: |
          cache_version="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E \
            "s|(profile-streak-stats/github-readme-streak-stats(-dark)?\.svg)(\?v=[0-9-]+)?|\1?v=${cache_version}|g" \
            README.md

      - name: push generated resources to the main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-streak-stats

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update profile streak stats"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          exit 1
