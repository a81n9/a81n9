name: Profile Trophy

on:
  schedule:
    # 00:00 UTC == 8:00 BJS
    - cron: '0 0 * * *'
  # 允许随时手动执行
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate github-profile-trophy.svg
        shell: bash
        run: |
          set -euo pipefail
          download_trophy() {
            local theme="$1"
            local output="$2"
            local query="?username=${{ github.repository_owner }}&row=1&column=4&theme=${theme}&rank=-%3F&margin-w=20"
            local mirrors=(
              "https://trophygithubreadmelang.cybee.dpdns.org/"
              "https://trophy.benkou.dev/"
              "https://github-trophies.devomb.com/"
            )

            for mirror in "${mirrors[@]}"; do
              local temporary_file
              temporary_file="$(mktemp "${RUNNER_TEMP}/trophy.XXXXXX.svg")"

              if curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 45 --retry 2 \
                "${mirror}${query}" --output "${temporary_file}" \
                && grep -q '<svg' "${temporary_file}"; then
                mv "${temporary_file}" "${output}"
                return 0
              fi

              rm -f "${temporary_file}"
            done

            return 1
          }

          download_trophy flat profile-trophy/github-profile-trophy.svg
          download_trophy juicyfresh profile-trophy/github-profile-trophy-dark.svg

      - name: update cache version
        shell: bash
        run: |
          cache_version="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E \
            "s|(profile-trophy/github-profile-trophy(-dark)?\.svg)(\?v=[0-9-]+)?|\1?v=${cache_version}|g" \
            README.md

      - name: push generated resources to the main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-trophy

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update profile trophy"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          exit 1
