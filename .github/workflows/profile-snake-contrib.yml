name: Profile Snake Contrib

on:
  schedule:
    # 16:00 UTC == 00:00 BJS (next day)
    - cron: '0 16 * * *'
  # 允许随时手动执行
  workflow_dispatch:
  # 每次指定分支推送自动执行
  # push:
  #   branches:
  #     - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-snake-contrib/github-contribution-grid-snake.svg
            profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: update cache version
        shell: bash
        run: |
          cache_version="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E \
            "s|(profile-snake-contrib/github-contribution-grid-snake(-dark)?\.svg)(\?v=[0-9-]+)?|\1?v=${cache_version}|g" \
            README.md

      - name: push generated resources to the main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-snake-contrib

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update profile snake"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          exit 1
